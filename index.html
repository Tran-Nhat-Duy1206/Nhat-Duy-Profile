<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Nhật Duy Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="fade-in">
    <!-- Overlay -->
    <div class="overlay"></div>

    <!-- Background -->
    <img src="Img/Castorise.jpg" alt="Ảnh nền" id="bg-image">
    <video autoplay muted loop preload="auto" id="bg-video" aria-label="Video nền chủ đề Castorise">
        <source src="Img/Castorise.mp4" type="video/mp4">
    </video>

    <!-- Loading -->
    <div id="loading-screen">
        <div class="spinner"></div>
        <p>Đang tải trang...</p>
    </div>

    <!-- Enter screen -->
    <div id="enter-screen">
        <h1>Chào mừng bạn đến với trang của Nhật Duy</h1>
        <button id="enter-btn">Nhấn để tiếp tục</button>
    </div>

    <!-- Profile -->
    <div class="profile-container">
        <div class="profile-card-v2">
            <div class="avatar-glow">
                <img src="Img/Hu-tao.jpg" alt="Ảnh đại diện của Nhật Duy">
            </div>
            <h2>Nhật Duy</h2>
            <p class="tagline">🎮 Game thủ | Đang Học Code</p>
            
            <div id="discord-activity" class="discord-card">
                <p>Đang lấy trạng thái Discord...</p>
            </div>

            <div class="social-icons">
                <a href="https://www.facebook.com/TranNhatDuy.1206/" target="_blank" title="Facebook">
                    <i class="fab fa-facebook-f"></i>
                </a>
                <a href="https://www.instagram.com/tnh.duy_1206/" target="_blank" title="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="https://discord.gg/8JQjrcjEF2" target="_blank" title="Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
            <a href="https://www.facebook.com/TranNhatDuy.1206/" class="glow-btn">Contact Me</a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p>© 2025 Nhật Duy. All rights reserved.</p>
        <p>Made with ❤️ by Nhật Duy</p>
    </div>

    <!-- Script -->
    <script src="script.js"></script>
</body>
</html>
